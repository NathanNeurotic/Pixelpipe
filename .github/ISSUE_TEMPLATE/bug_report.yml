name: Bug report
description: Report something broken in Pixelpipe
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Open Pixelpipe -> Diagnostics / repair -> Copy, then paste the output below.
  - type: textarea
    id: diagnostics
    attributes:
      label: Pixelpipe diagnostics
      description: Paste the full diagnostics output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: rclone
    attributes:
      label: rclone version
  - type: input
    id: winfsp
    attributes:
      label: WinFsp version
