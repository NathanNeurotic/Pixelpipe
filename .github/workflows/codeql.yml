name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '32 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build
        shell: pwsh
        run: dotnet build Pixelpipe.csproj -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
