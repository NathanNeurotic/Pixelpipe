name: Build and Rolling Release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pixelpipe
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Install Inno Setup for installer build
        if: github.event_name != 'pull_request'
        shell: pwsh
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        continue-on-error: true
        run: .\scripts\build-installer.ps1 -Optional

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Dist = Join-Path $PWD 'dist'
          $Exe = Join-Path $Dist 'Pixelpipe.exe'
          if (!(Test-Path $Exe)) { throw "Build output missing: $Exe" }

          $Zip = Join-Path $Dist 'Pixelpipe-Windows-x64.zip'
          if (Test-Path $Zip) { Remove-Item $Zip -Force }
          Compress-Archive -Path $Exe, README.md, LICENSE, docs -DestinationPath $Zip -Force

          Push-Location $Dist
          Remove-Item SHA256SUMS.txt -Force -ErrorAction SilentlyContinue
          foreach ($file in @('Pixelpipe.exe','Pixelpipe-Windows-x64.zip','Pixelpipe-Setup.exe')) {
            if (Test-Path $file) {
              Get-FileHash $file -Algorithm SHA256 |
                ForEach-Object { "$($_.Hash)  $file" } |
                Add-Content SHA256SUMS.txt -Encoding ASCII
            }
          }
          Pop-Location

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixelpipe-${{ github.sha }}
          path: |
            dist/Pixelpipe.exe
            dist/Pixelpipe-Windows-x64.zip
            dist/Pixelpipe-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: ignore

      - name: Publish rolling release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'rolling'
          $Short = $env:COMMIT_SHA.Substring(0, 7)
          $ReleaseName = "Pixelpipe Rolling Release ($Short)"
          $Notes = @"
          Automated rolling build from commit $env:COMMIT_SHA.

          This is rebuilt on every push to main/master. It is intended for testers and early users.

          Files:
          - Pixelpipe.exe: standalone tray app
          - Pixelpipe-Windows-x64.zip: portable package
          - Pixelpipe-Setup.exe: optional installer, when the installer build succeeds
          - SHA256SUMS.txt: checksum file
          "@

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $Tag $env:COMMIT_SHA
          git push origin "refs/tags/$Tag" --force

          $Assets = @('dist/Pixelpipe.exe','dist/Pixelpipe-Windows-x64.zip','dist/SHA256SUMS.txt')
          if (Test-Path 'dist/Pixelpipe-Setup.exe') { $Assets += 'dist/Pixelpipe-Setup.exe' }

          gh release view $Tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag $Assets --repo $env:REPO --title $ReleaseName --notes $Notes --prerelease
          } else {
            gh release edit $Tag --repo $env:REPO --title $ReleaseName --notes $Notes --prerelease
            gh release upload $Tag $Assets --repo $env:REPO --clobber
          }
