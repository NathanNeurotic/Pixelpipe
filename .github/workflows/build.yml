name: Build and Rolling Release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize the rolling-release publish so two quick pushes don't race on the
# `rolling` tag. PR builds and non-main pushes still run in parallel because the
# concurrency group is keyed by ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt in to Node 24 for actions until the runners switch over, so the Node 20
  # deprecation warning stops showing up in every CI run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version and changelog section
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Changelog = Get-Content -Raw -Path CHANGELOG.md
          $Match = [regex]::Match($Changelog, '(?ms)^##\s+(?<version>\d+\.\d+\.\d+)\s*\r?\n(?<body>.*?)(?=^##\s+\d+\.\d+\.\d+\s*\r?\n|\z)')
          if (!$Match.Success) { throw 'Could not find a version header (## X.Y.Z) in CHANGELOG.md' }
          $Version = $Match.Groups['version'].Value
          $Body = $Match.Groups['body'].Value.Trim()
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          $BodyFile = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $BodyFile -Value $Body -Encoding utf8
          "body_file=$BodyFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "Detected version: $Version"

      - name: Sync installer version
        shell: pwsh
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Iss = 'installer\Pixelpipe.iss'
          $Content = Get-Content -Raw -Path $Iss
          $Updated = [regex]::Replace($Content, '#define MyAppVersion "\d+\.\d+\.\d+"', "#define MyAppVersion `"$env:VERSION`"")
          Set-Content -Path $Iss -Value $Updated -Encoding utf8

      - name: Build Pixelpipe
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Run unit tests
        shell: pwsh
        run: .\scripts\run-tests.ps1

      - name: Smoke test tray menu placement and theme
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Exe = Join-Path $PWD 'dist\Pixelpipe.exe'
          if (!(Test-Path $Exe)) { throw "Build output missing: $Exe" }
          $StdOut = Join-Path $env:RUNNER_TEMP 'smoke-stdout.txt'
          $StdErr = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          $proc = Start-Process -FilePath $Exe -ArgumentList '/smoketest-menu' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $StdOut -RedirectStandardError $StdErr
          if (Test-Path $StdErr) { $err = Get-Content $StdErr -Raw; if (![string]::IsNullOrWhiteSpace($err)) { Write-Host "smoke stderr:"; Write-Host $err } }
          if (Test-Path $StdOut) { $out = Get-Content $StdOut -Raw; if (![string]::IsNullOrWhiteSpace($out)) { Write-Host "smoke stdout:"; Write-Host $out } }
          if ($proc.ExitCode -ne 0) { throw "Tray menu smoke test failed with code $($proc.ExitCode)" }

      - name: Optional rclone local watch-folder smoke
        shell: pwsh
        run: .\scripts\watch-folder-smoke.ps1 -SkipIfMissing

      - name: Install Inno Setup for installer build
        if: github.event_name != 'pull_request'
        shell: pwsh
        # Choco install is the only step that can flake on a network outage;
        # downstream steps handle a missing ISCC gracefully.
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        # No longer continue-on-error: if the script can't find ISCC it exits 0
        # in -Optional mode, but if ISCC is found and the actual installer build
        # fails, the workflow should fail too (the v0.4.0 release shipped without
        # an installer because this step was silently swallowing the error).
        run: .\scripts\build-installer.ps1 -Optional

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Dist = Join-Path $PWD 'dist'
          $Exe = Join-Path $Dist 'Pixelpipe.exe'
          if (!(Test-Path $Exe)) { throw "Build output missing: $Exe" }

          $Zip = Join-Path $Dist 'Pixelpipe-Windows-x64.zip'
          if (Test-Path $Zip) { Remove-Item $Zip -Force }
          Compress-Archive -Path $Exe, README.md, LICENSE, docs -DestinationPath $Zip -Force

          Push-Location $Dist
          Remove-Item SHA256SUMS.txt -Force -ErrorAction SilentlyContinue
          foreach ($file in @('Pixelpipe.exe','Pixelpipe-Windows-x64.zip','Pixelpipe-Setup.exe')) {
            if (Test-Path $file) {
              Get-FileHash $file -Algorithm SHA256 |
                ForEach-Object { "$($_.Hash)  $file" } |
                Add-Content SHA256SUMS.txt -Encoding ASCII
            }
          }
          Pop-Location

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pixelpipe-${{ github.sha }}
          path: |
            dist/Pixelpipe.exe
            dist/Pixelpipe-Windows-x64.zip
            dist/Pixelpipe-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: Pixelpipe-${{ github.sha }}
          path: dist

      - name: Read version and changelog section
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Changelog = Get-Content -Raw -Path CHANGELOG.md
          $Match = [regex]::Match($Changelog, '(?ms)^##\s+(?<version>\d+\.\d+\.\d+)\s*\r?\n(?<body>.*?)(?=^##\s+\d+\.\d+\.\d+\s*\r?\n|\z)')
          if (!$Match.Success) { throw 'Could not find a version header (## X.Y.Z) in CHANGELOG.md' }
          $Version = $Match.Groups['version'].Value
          $Body = $Match.Groups['body'].Value.Trim()
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          $BodyFile = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $BodyFile -Value $Body -Encoding utf8
          "body_file=$BodyFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "Detected version: $Version"

      - name: Publish versioned release if new
        id: versioned
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.changelog.outputs.version }}
          BODY_FILE: ${{ steps.changelog.outputs.body_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = "v$env:VERSION"
          gh release view $Tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $Tag already exists; nothing to do."
            "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            exit 0
          }
          $ReleaseName = "Pixelpipe v$env:VERSION"
          $Changelog = (Get-Content -Raw -Path $env:BODY_FILE).TrimEnd()
          $Short = $env:COMMIT_SHA.Substring(0, 7)
          $NotesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $Lines = @(
            "Built from commit [$Short](https://github.com/$env:REPO/commit/$env:COMMIT_SHA) on $((Get-Date).ToString('yyyy-MM-dd')).",
            "",
            "## What's in this release",
            "",
            $Changelog,
            "",
            "## Downloads",
            "",
            "- ``Pixelpipe.exe`` — standalone tray app (drop it on your Desktop and run, no install required)",
            "- ``Pixelpipe-Windows-x64.zip`` — portable bundle (exe + README + LICENSE + docs)",
            "- ``Pixelpipe-Setup.exe`` — optional Inno Setup installer, when the installer build succeeds",
            "- ``SHA256SUMS.txt`` — SHA-256 checksums for the downloads above",
            "",
            "### First run: SmartScreen",
            "",
            "These builds are **not code-signed**, so Windows SmartScreen shows ""Windows protected your PC"" / ""unrecognized app"" the first time you run ``Pixelpipe.exe`` or ``Pixelpipe-Setup.exe``. That is expected for an unsigned open-source app, not a malware detection — click **More info → Run anyway**. To verify the download first, check it against ``SHA256SUMS.txt`` (``Get-FileHash .\Pixelpipe.exe -Algorithm SHA256``).",
            "",
            "Run Pixelpipe normally, not as Administrator. First launch will prompt for rclone + WinFsp setup."
          )
          Set-Content -Path $NotesFile -Value $Lines -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $Tag $env:COMMIT_SHA
          git push origin "refs/tags/$Tag"

          $Assets = @('dist/Pixelpipe.exe','dist/Pixelpipe-Windows-x64.zip','dist/SHA256SUMS.txt')
          if (Test-Path 'dist/Pixelpipe-Setup.exe') { $Assets += 'dist/Pixelpipe-Setup.exe' }

          gh release create $Tag $Assets --repo $env:REPO --title $ReleaseName --notes-file $NotesFile
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.changelog.outputs.version }}
          BODY_FILE: ${{ steps.changelog.outputs.body_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'rolling'
          $Short = $env:COMMIT_SHA.Substring(0, 7)
          $ReleaseName = "Pixelpipe rolling build ($Short, after v$env:VERSION)"

          # Get the most recent non-merge commit subject so the description shows the actual change.
          $Subject = (git log -1 --no-merges --pretty=%s $env:COMMIT_SHA 2>$null)
          if ([string]::IsNullOrWhiteSpace($Subject)) { $Subject = (git log -1 --pretty=%s $env:COMMIT_SHA).Trim() }
          $Subject = $Subject.Trim()

          # Does v<version> already point at this commit? If so, rolling and the tag are equivalent.
          $VersionTag = "v$env:VERSION"
          $VersionSha = (git rev-parse --verify "refs/tags/$VersionTag" 2>$null)
          $TracksReleased = $false
          if ($LASTEXITCODE -eq 0 -and $VersionSha -eq $env:COMMIT_SHA) { $TracksReleased = $true }

          if ($TracksReleased) {
            $StatusLine = "Identical to the [$VersionTag release](https://github.com/$env:REPO/releases/tag/$VersionTag). Future pushes to main will move this rolling tag forward; the $VersionTag release is permanent."
          } else {
            $StatusLine = "Tracks main after the [$VersionTag release](https://github.com/$env:REPO/releases/tag/$VersionTag). For a frozen build, use $VersionTag; for the latest fixes since then, use this rolling build."
          }

          $NotesFile = Join-Path $env:RUNNER_TEMP 'rolling-notes.md'
          $Lines = @(
            "Rolling build of Pixelpipe from commit [$Short](https://github.com/$env:REPO/commit/$env:COMMIT_SHA).",
            "",
            "**Latest change:** $Subject",
            "",
            $StatusLine,
            "",
            "## Downloads",
            "",
            "- ``Pixelpipe.exe`` — standalone tray app (drop it on your Desktop and run, no install required)",
            "- ``Pixelpipe-Windows-x64.zip`` — portable bundle (exe + README + LICENSE + docs)",
            "- ``Pixelpipe-Setup.exe`` — optional Inno Setup installer, when the installer build succeeds",
            "- ``SHA256SUMS.txt`` — SHA-256 checksums for the downloads above",
            "",
            "### First run: SmartScreen",
            "",
            "These builds are **not code-signed**, so Windows SmartScreen shows ""Windows protected your PC"" / ""unrecognized app"" the first time you run ``Pixelpipe.exe`` or ``Pixelpipe-Setup.exe``. That is expected for an unsigned open-source app, not a malware detection — click **More info → Run anyway**. To verify the download first, check it against ``SHA256SUMS.txt`` (``Get-FileHash .\Pixelpipe.exe -Algorithm SHA256``).",
            "",
            "Run Pixelpipe normally, not as Administrator. This build is intended for testers and early users; expect it to change as fixes land on main."
          )
          Set-Content -Path $NotesFile -Value $Lines -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $Tag $env:COMMIT_SHA
          git push origin "refs/tags/$Tag" --force

          $Assets = @('dist/Pixelpipe.exe','dist/Pixelpipe-Windows-x64.zip','dist/SHA256SUMS.txt')
          if (Test-Path 'dist/Pixelpipe-Setup.exe') { $Assets += 'dist/Pixelpipe-Setup.exe' }

          gh release view $Tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag $Assets --repo $env:REPO --title $ReleaseName --notes-file $NotesFile --prerelease
          } else {
            gh release edit $Tag --repo $env:REPO --title $ReleaseName --notes-file $NotesFile --prerelease
            gh release upload $Tag $Assets --repo $env:REPO --clobber
          }
