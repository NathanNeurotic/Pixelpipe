<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Pixelpipe themed tray menu mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="620" fill="url(#bg)"/>
  <g transform="translate(72 70)">
    <text x="0" y="0" fill="#58a6ff" font-family="Segoe UI, Arial" font-size="46" font-weight="700">Pixelpipe</text>
    <text x="2" y="34" fill="#8b949e" font-family="Segoe UI, Arial" font-size="18">Pixeldrain filesystem tray mount via rclone</text>
  </g>
  <g filter="url(#shadow)" transform="translate(410 60)">
    <rect x="0" y="0" width="390" height="500" rx="14" fill="#0e1218" stroke="#30363d"/>
    <rect x="0" y="0" width="390" height="58" rx="14" fill="#151b23"/>
    <text x="22" y="36" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Pixelpipe</text>
    <text x="22" y="82" fill="#3fb950" font-family="Segoe UI, Arial" font-size="15">Status: mounted on P:\ - low overhead</text>
    <text x="22" y="112" fill="#c9d1d9" font-family="Segoe UI, Arial" font-size="15">Storage: 52.38 GB / 3.64 TB</text>
    <text x="22" y="142" fill="#c9d1d9" font-family="Segoe UI, Arial" font-size="15">Transfer quota: 24 GB / 4 TB</text>
    <text x="22" y="172" fill="#c9d1d9" font-family="Segoe UI, Arial" font-size="15">Current speed: 4.2 MB/s</text>
    <line x1="20" y1="197" x2="370" y2="197" stroke="#30363d"/>
    <rect x="14" y="214" width="362" height="34" rx="8" fill="#1f6feb"/>
    <text x="22" y="237" fill="#ffffff" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Open P:\</text>
    <text x="22" y="278" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15">Unmount Pixelpipe</text>
    <text x="22" y="316" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15">Bandwidth limit  ›</text>
    <text x="22" y="354" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15">Drive letter  ›</text>
    <text x="22" y="392" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15">Diagnostics / repair...</text>
    <text x="22" y="430" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15">Settings...</text>
    <line x1="20" y1="452" x2="370" y2="452" stroke="#30363d"/>
    <text x="22" y="480" fill="#8b949e" font-family="Segoe UI, Arial" font-size="14">Normal-user startup, no console window</text>
  </g>
  <g transform="translate(88 180)">
    <rect x="0" y="0" width="260" height="260" rx="36" fill="#151b23" stroke="#30363d"/>
    <path d="M72 100h90c36 0 58 22 58 58s-22 58-58 58H72z" fill="#58a6ff" opacity="0.16"/>
    <path d="M72 96h96c38 0 64 24 64 62s-26 62-64 62H72" fill="none" stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
    <path d="M72 130h86c18 0 29 10 29 28s-11 28-29 28H72" fill="none" stroke="#f0f6fc" stroke-width="18" stroke-linecap="round"/>
    <rect x="58" y="70" width="42" height="42" rx="10" fill="#3fb950"/>
    <rect x="58" y="203" width="42" height="42" rx="10" fill="#1f6feb"/>
  </g>
